name: torneo_app
description: Torneo Premier - gestión de ligas de fútbol (migración Flutter de la app React).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  intl: any
  image_picker: ^1.1.2
  share_plus: ^12.0.2
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
